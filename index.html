<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>您身后</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;background:#040308;background-image:radial-gradient(rgba(130,100,190,.13) 1px,transparent 1px);background-size:3px 3px;font-family:"Noto Serif SC",-apple-system,"PingFang SC","Microsoft YaHei",serif;color:#cfc6e0;overflow:hidden;}
#app{position:relative;width:100%;max-width:380px;height:660px;border-radius:34px;border:2px solid #23203c;overflow:hidden;background:#05040b;box-shadow:0 0 50px rgba(120,80,200,.22),inset 0 0 90px #000;transition:background .6s;touch-action:pan-y;}
#app:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:120;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);}
#vine{position:absolute;inset:0;pointer-events:none;z-index:118;overflow:hidden;}
#vine .pt{position:absolute;top:-24px;font-size:11px;color:#d8ccff;opacity:.6;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(740px) rotate(220deg);opacity:0;}}
#flash{position:absolute;inset:0;z-index:130;pointer-events:none;display:none;background:#000;}
#flash.on{display:block;animation:flin 4.2s ease-out forwards;}
@keyframes flin{0%{opacity:0}4%{opacity:1}8%{opacity:.15}12%{opacity:1}62%{opacity:1}100%{opacity:0}}
#flash .glow{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 46%,rgba(160,100,255,.34),transparent 58%);animation:glowin 4.2s ease-out forwards;}
@keyframes glowin{0%,12%{opacity:0}26%{opacity:1}62%{opacity:.9}100%{opacity:0}}
#flash .eye{position:absolute;top:43%;width:40px;height:20px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle,rgba(214,170,255,.98),rgba(120,60,200,.35) 58%,transparent 74%);box-shadow:0 0 30px rgba(175,115,255,.95);opacity:0;}
#flash .eye.l{left:29%;animation:eyeinL 4.2s ease-out forwards;}
#flash .eye.r{right:29%;animation:eyeinR 4.2s ease-out forwards;}
@keyframes eyeinL{0%,12%{opacity:0;transform:rotate(-7deg) scale(.55);}24%{opacity:1;transform:rotate(-7deg) scale(1);}62%{opacity:1;transform:rotate(-7deg) scale(1);}100%{opacity:0;transform:rotate(-7deg) scale(1);}}
@keyframes eyeinR{0%,12%{opacity:0;transform:rotate(7deg) scale(.55);}24%{opacity:1;transform:rotate(7deg) scale(1);}62%{opacity:1;transform:rotate(7deg) scale(1);}100%{opacity:0;transform:rotate(7deg) scale(1);}}
#flash .msg{position:absolute;left:0;right:0;bottom:27%;text-align:center;font-size:12px;letter-spacing:.3em;color:#e2d8ff;text-shadow:0 0 12px rgba(160,110,255,.8);opacity:0;animation:msgin 4.2s ease-out forwards;}
@keyframes msgin{0%,30%{opacity:0}44%{opacity:1}62%{opacity:1}100%{opacity:0}}
.edge{position:absolute;inset:0;pointer-events:none;z-index:115;opacity:0;transition:opacity 1.4s;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.92) 100%);}
.edge.on{opacity:1;}
#app.torch{background:#f6f2ff;}
#app.torch .sb{color:#4a3866;}
#app.torch .nm,#app.torch .hint{color:#4a3866;}
.notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:104px;height:20px;border-radius:12px;background:#000;z-index:110;pointer-events:none;}
.sb{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:10.5px;letter-spacing:.06em;color:#a99cc0;z-index:70;pointer-events:none;}
.sb .r{display:flex;align-items:center;gap:6px;}
.bat{display:inline-block;width:20px;height:10px;border:1px solid #8d80ac;border-radius:2px;position:relative;}
.bat i{position:absolute;left:1px;top:1px;bottom:1px;background:#a99cc0;display:block;transition:width .3s;}
.bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:#8d80ac;}
.sig{display:flex;align-items:flex-end;gap:1.5px;}
.sig i{width:2.4px;background:#8d80ac;display:block;}
.zone{position:absolute;top:0;width:50%;height:62px;z-index:60;cursor:pointer;}
.z1{left:0;} .z2{right:0;}
.sc{position:absolute;inset:0;display:none;flex-direction:column;}
.sc.on{display:flex;}
#lock{justify-content:space-between;align-items:center;padding:60px 26px 40px;text-align:center;}
#lock .lk{font-size:9px;letter-spacing:.44em;color:#6d5996;}
#lock .lt{font-size:64px;line-height:1;color:#e2d8ff;font-weight:300;text-shadow:0 0 22px rgba(150,110,255,.35);margin-top:14px;}
#lock .ld{font-size:12px;color:#8d80ac;letter-spacing:.14em;margin-top:8px;}
#lock .card{margin-top:26px;width:100%;padding:11px 13px;border:1px solid #3a2f5e;border-radius:12px;background:rgba(22,16,42,.75);text-align:left;font-size:11.5px;line-height:1.8;color:#c2b9d8;transition:opacity .6s;}
#lock .card b{display:block;font-size:10px;letter-spacing:.14em;color:#8d80ac;margin-bottom:4px;font-weight:400;}
#lock .up{font-size:12px;color:#c8a6ff;letter-spacing:.2em;animation:bl 2s infinite;cursor:pointer;padding:13px 24px;border:1px solid #3a2f5e;border-radius:14px;background:rgba(30,22,56,.6);}
@keyframes bl{50%{opacity:.35;}}
#home{padding-top:44px;}
.track{display:flex;flex:1;transition:transform .35s ease;}
.pg{min-width:100%;padding:8px 18px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;align-content:start;}
.ic{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;position:relative;}
.ic .bx{width:54px;height:54px;border-radius:15px;background:linear-gradient(160deg,#1d1732,#131022);border:1px solid #2e2650;display:flex;align-items:center;justify-content:center;font-size:22px;transition:.22s;}
.ic .nm{font-size:9.5px;color:#a295c0;letter-spacing:.03em;line-height:1.25;text-align:center;}
.ic.black .bx{background:linear-gradient(160deg,#0a0a0f,#000);border-color:#1b1b28;}
.ic .del{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:#3a2f5e;color:#c8a6ff;font-size:12px;line-height:16px;text-align:center;display:none;}
.ic.jig .bx{animation:jg .35s infinite;}
@keyframes jg{0%{transform:rotate(-1.6deg);}50%{transform:rotate(1.6deg);}100%{transform:rotate(-1.6deg);}}
.dots{display:flex;justify-content:center;gap:7px;padding:6px 0 4px;}
.dots i{width:5px;height:5px;border-radius:50%;background:#33295a;}
.dots i.on{background:#b98cff;}
.dock{flex:0 0 auto;margin:4px 12px 8px;padding:9px 6px 6px;border-radius:20px;background:rgba(24,18,44,.72);border:1px solid #241d40;display:flex;justify-content:space-around;}
.hbar{flex:0 0 auto;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;}
.hbar i{width:150px;height:6px;border-radius:4px;background:#3a2f5e;box-shadow:0 0 10px rgba(120,90,200,.35);}
.hbar span{font-size:9.5px;color:#6f5f96;letter-spacing:.28em;}
.hint{position:absolute;left:0;right:0;bottom:74px;text-align:center;font-size:10.5px;color:#6f5f96;letter-spacing:.05em;padding:0 22px;line-height:1.75;z-index:40;pointer-events:none;transition:opacity .5s;}
#banners{position:absolute;top:38px;left:10px;right:10px;z-index:80;pointer-events:none;}
.bn{pointer-events:auto;margin-bottom:8px;padding:10px 12px;border-radius:14px;border:1px solid #3a2f5e;background:rgba(26,19,48,.96);box-shadow:0 8px 22px rgba(0,0,0,.6);font-size:11.5px;line-height:1.7;color:#d3c9ec;transform:translateY(-150%);animation:drop .4s forwards;cursor:pointer;}
@keyframes drop{to{transform:translateY(0);}}
.bn b{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;color:#9a8cbc;font-weight:400;margin-bottom:4px;}
.bn.out{animation:rise .3s forwards;}
@keyframes rise{to{transform:translateY(-170%);opacity:0;}}
.av{position:absolute;inset:0;z-index:50;background:#08060f;display:none;flex-direction:column;animation:zoom .28s ease;}
@keyframes zoom{from{transform:scale(.84);opacity:.3;}to{transform:scale(1);opacity:1;}}
.av.on{display:flex;}
.ahead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:36px 14px 10px;border-bottom:1px solid #221b3a;font-size:12px;color:#c8b8f0;letter-spacing:.12em;}
.ahead .bk{cursor:pointer;color:#c8a6ff;font-size:12.5px;letter-spacing:.1em;padding:11px 18px;border:1px solid #3a2f5e;border-radius:14px;background:rgba(30,22,56,.75);}
.afoot{flex:0 0 auto;padding:8px 14px 14px;border-top:1px solid #1a1530;background:#08060f;}
.abody{flex:1;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;font-size:12.5px;line-height:2.05;color:#c2b9d8;}
.abody p{margin:0 0 10px;}
.abody .dim{color:#7d6f9a;font-size:11.5px;}
.abody .say{color:#8f82b4;font-size:11.5px;line-height:1.95;font-style:italic;}
.abody .foot{margin-top:16px;padding-top:10px;border-top:1px dashed #2a2348;color:#8f82b4;font-size:11.5px;line-height:1.95;}
.abody .hot{color:#e07eb0;}
.abody .g{color:#b98cff;text-shadow:1px 0 rgba(255,0,90,.5),-1px 0 rgba(0,200,255,.45);}
.abody .me{color:#a9e6d2;}
.msg{display:flex;gap:9px;margin-bottom:11px;align-items:flex-start;}
.msg .t{flex:0 0 44px;color:#6f5f96;font-size:10px;padding-top:3px;}
.msg .c{flex:1;padding:8px 11px;border-radius:3px;background:rgba(28,20,52,.75);border:1px solid #2b2348;cursor:pointer;}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.th{height:78px;border:1px solid #2b2348;border-radius:3px;background:#12102a;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#6f5f96;cursor:pointer;position:relative;overflow:hidden;}
.th.seen{border-color:#5b4796;color:#b98cff;}
.th .sh{position:absolute;bottom:6px;right:8px;width:9px;height:14px;border-radius:50% 50% 30% 30%;background:rgba(0,0,0,.85);}
.photo{border:1px solid #2b2348;border-radius:3px;padding:14px;font-size:12px;line-height:2;color:#bdb2d4;background:linear-gradient(170deg,#12102a,#0d0b1c);position:relative;min-height:150px;overflow:hidden;}
.photo .shadow{position:absolute;background:rgba(0,0,0,.9);border-radius:40% 40% 20% 20%;}
.camwrap{border:1px solid #2b2348;border-radius:4px;height:180px;position:relative;overflow:hidden;background:linear-gradient(180deg,#0b0a18,#151027);}
.camwrap .frame{position:absolute;inset:14px;border:1px solid #33295a;}
.camwrap .lbl{position:absolute;left:18px;top:18px;font-size:9.5px;color:#6f5f96;letter-spacing:.14em;}
.btn{display:block;width:100%;padding:13px;margin-top:10px;border:1px solid #5b4796;background:rgba(30,22,56,.7);color:#c8a6ff;font-family:inherit;font-size:12.5px;letter-spacing:.16em;border-radius:3px;cursor:pointer;transition:.22s;}
.btn.d{border-color:#33295a;color:#6f5f96;}
.feed{border:1px solid #2b2348;border-radius:3px;padding:9px 11px;margin-bottom:8px;font-size:11.5px;line-height:1.9;color:#bdb2d4;cursor:pointer;background:#0f0d1e;}
.feed b{color:#8d80ac;font-weight:400;font-size:10px;letter-spacing:.1em;display:block;margin-bottom:3px;}
.statusline{margin-top:10px;font-size:11px;color:#7d6f9a;line-height:1.9;}
.reply{margin-top:16px;border-top:1px dashed #33295a;padding-top:12px;}
.reply textarea{width:100%;height:76px;resize:none;font-family:inherit;font-size:12.5px;line-height:1.9;color:#e8e0ff;background:#100d1f;border:1px solid #3a2f5e;border-radius:4px;padding:10px;letter-spacing:.02em;}
.reply .hintline{font-size:10px;color:#6f5f96;line-height:1.8;margin-top:6px;}
.panel{position:absolute;inset:0;z-index:100;display:none;background:rgba(6,4,12,.9);border-radius:34px;padding:44px 18px 16px;flex-direction:column;}
.panel.on{display:flex;}
.panel h3{font-size:11px;letter-spacing:.24em;color:#8d80ac;margin:0 0 12px;font-weight:400;}
.panel .cl{position:absolute;top:42px;right:18px;font-size:12px;color:#c8a6ff;cursor:pointer;letter-spacing:.12em;padding:11px 16px;border:1px solid #3a2f5e;border-radius:14px;background:rgba(30,22,56,.75);}
.toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.tg{padding:14px 12px;border-radius:16px;border:1px solid #2b2348;background:#131024;text-align:center;cursor:pointer;font-size:11.5px;color:#8d80ac;letter-spacing:.06em;transition:.2s;}
.tg.on{border-color:#7a5fc0;background:#241a44;color:#d8ccff;box-shadow:0 0 18px rgba(140,100,255,.3);}
.nclist{flex:1;overflow-y:auto;margin-bottom:8px;}
.ncitem{padding:10px 12px;border-radius:12px;border:1px solid #241d40;background:rgba(22,16,42,.8);margin-bottom:8px;font-size:11.5px;line-height:1.75;color:#c2b9d8;}
.ncitem b{display:flex;justify-content:space-between;font-size:10px;color:#8d80ac;font-weight:400;margin-bottom:4px;letter-spacing:.08em;}
.cards{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-bottom:8px;}
.cardm{border:1px solid #2b2348;border-radius:14px;height:120px;background:linear-gradient(170deg,#131029,#0b0918);cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:9px 12px;font-size:10.5px;color:#7d6f9a;letter-spacing:.1em;transition:.3s;}
.cardm:before{content:"";position:absolute;right:16px;bottom:0;width:34px;height:70px;border-radius:46% 46% 16% 16%;background:rgba(0,0,0,.85);}
.cardm.gone{transform:translateX(120%) rotate(6deg);opacity:0;}
.fin{position:absolute;inset:0;z-index:105;background:#000;display:none;flex-direction:column;justify-content:center;padding:30px 24px;overflow-y:auto;}
.fin.on{display:flex;}
.fin .tx{font-size:13px;line-height:2.2;color:#c8b8f0;min-height:90px;}
.fin .miss{margin-top:14px;font-size:10.5px;line-height:1.9;color:#5b4f7d;letter-spacing:.04em;border-top:1px dashed #241d40;padding-top:10px;}
.ch{display:block;width:100%;text-align:left;padding:13px 14px;margin-top:9px;border:1px solid #3a2f5e;background:rgba(20,14,38,.8);color:#bfb4dc;font-family:inherit;font-size:12.5px;line-height:1.7;border-radius:3px;cursor:pointer;transition:.2s;}
.ch:hover{border-color:#7a5fc0;color:#e6dcff;transform:translateX(3px);}
.endwrap{position:absolute;inset:0;z-index:110;background:#05040b;display:none;overflow-y:auto;padding:48px 22px 30px;}
.endwrap.on{display:block;}
.endwrap .k{font-size:9.5px;letter-spacing:.4em;color:#6d5996;}
.endwrap h2{margin:12px 0 8px;font-size:18px;letter-spacing:.14em;color:#d8ccff;text-shadow:0 0 14px rgba(150,110,255,.35);cursor:pointer;user-select:none;}
.endwrap .e{font-size:12.5px;line-height:2.15;color:#c2b9d8;}
.endwrap .e p{margin:0 0 9px;}
.endwrap .e p.scr{color:#8f82b4;letter-spacing:2px;font-family:monospace,sans-serif;}
.endwrap .sig{text-align:right;font-size:10.5px;color:#8d80ac;margin-top:14px;}
</style>
</head>
<body>
<div id="app">
  <div class="notch"></div>
  <div id="vine"></div>
  <div class="edge" id="edge"></div>
  <div id="flash"><div class="glow"></div><div class="eye l"></div><div class="eye r"></div><div class="msg">看 见 了 吗</div></div>
  <div class="sb"><span id="sbClock">--:--</span>
    <span class="r"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span class="bat"><i id="batFill" style="width:47%"></i></span><span id="sbBat">47%</span></span>
  </div>
  <div class="zone z1" id="zoneL"></div>
  <div class="zone z2" id="zoneR"></div>
  <div id="banners"></div>

  <div class="sc on" id="lock">
    <div>
      <div class="lk">本 丸 · 夜 半</div>
      <div class="lt" id="lockClock">--:--</div>
      <div class="ld" id="lockDate">—</div>
      <div class="card" id="lockCard"><b>压切长谷部</b>主。您睡了吗。</div>
    </div>
    <div class="up" id="unlockHint">↑ 上 滑 解 锁</div>
  </div>

  <div class="sc" id="home">
    <div class="track" id="track">
      <div class="pg" id="pg0"></div>
      <div class="pg" id="pg1"></div>
    </div>
    <div class="dots"><i class="on" id="d0"></i><i id="d1"></i></div>
    <div class="dock">
      <div class="ic" data-a="msg"><div class="bx">✉</div></div>
      <div class="ic" data-a="cam"><div class="bx">◎</div></div>
      <div class="ic" data-a="pho"><div class="bx">▣</div></div>
      <div class="ic" data-a="set"><div class="bx">⚙</div></div>
    </div>
    <div class="hbar" id="hbar"><i></i><span>点 这 里 或 上 滑 · 后 台</span></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="av" id="av">
    <div class="ahead"><span class="bk" id="bk">‹ 返回</span><span id="atitle">应用</span></div>
    <div class="abody" id="abody"></div>
    <div class="afoot"><button class="btn" id="bkBottom" style="margin:0;">‹ 返 回 桌 面</button></div>
  </div>

  <div class="panel" id="cc">
    <span class="cl" id="ccClose">收 起</span>
    <h3>控 制 中 心</h3>
    <div class="toggles">
      <div class="tg" id="tgQuiet">少 打 扰</div>
      <div class="tg" id="tgFlight">飞行模式</div>
      <div class="tg" id="tgDnd">勿扰模式</div>
      <div class="tg on" id="tgVib">震动</div>
      <div class="tg" id="tgTorch">手电筒</div>
    </div>
    <div class="ncitem" id="ccNote">……</div>
    <button class="btn" data-close="cc">收 起 面 板</button>
  </div>

  <div class="panel" id="nc">
    <span class="cl" id="ncClose">收 起</span>
    <h3>通 知 中 心</h3>
    <div class="nclist" id="nclist"></div>
    <button class="btn" data-close="nc">收 起 面 板</button>
  </div>

  <div class="panel" id="multi">
    <span class="cl" id="multiClose">收 起</span>
    <h3>后 台 应 用　·　点 一 张 就 划 掉</h3>
    <div class="cards" id="cards"></div>
    <button class="btn" data-close="multi">收 起 面 板</button>
  </div>

  <div class="fin" id="fin">
    <div class="tx" id="fintx"></div>
    <div id="finch"></div>
    <div class="miss" id="finmiss"></div>
  </div>

  <div class="endwrap" id="endwrap"></div>
</div>
<script>
var TAPNEED=3,CALLNEED=20;
var st={open:{},total:0,prox:0,vib:true,quiet:false,wallTap:0,photoSeen:0,shot:0,callSec:0,callDone:false,mapRef:0,msgs:0,feeds:0,clearTimes:0,replies:0,lastMsg:"",flight:false,dnd:false,torch:false,page:0,unlocked:false,stage:0,lastAct:Date.now(),flags:{}};
var batPct=47,batCharging=false;
var APPS=[
{id:"msg",  ic:"✉", nm:"消息",   nm2:"主"},
{id:"pho",  ic:"▣", nm:"相册",   nm2:"他"},
{id:"cam",  ic:"◎", nm:"相机",   nm2:"他"},
{id:"call", ic:"☎", nm:"通话",   nm2:"主"},
{id:"mon",  ic:"▤", nm:"监控",   nm2:"本丸"},
{id:"map",  ic:"◇", nm:"定位",   nm2:"半步"},
{id:"cont", ic:"☰", nm:"通讯录", nm2:"只有一条"},
{id:"set",  ic:"⚙", nm:"设置",   nm2:"我"},
{id:"locka",ic:"▮", nm:"门锁",   nm2:"外面没人"},
{id:"heal", ic:"♡", nm:"健康",   nm2:"平线"},
{id:"wifi", ic:"≋", nm:"Wi-Fi",  nm2:"0 米"},
{id:"void", ic:"",  nm:"",       nm2:""}
];
var APPTITLE={msg:"消息",pho:"相册",cam:"相机",call:"通话",mon:"监控",map:"定位",cont:"通讯录",set:"设置",locka:"门锁",heal:"健康",wifi:"Wi-Fi",void:"　　"};
var APPINTRO={
msg:"「这些是今夜发给您的。每条我都改过三遍，怕太啰嗦。」",
pho:"「这些照片是您自己拍的。我只在后面站着。」",
cam:"「镜头朝哪边都成。反正我在您身后。」",

"没有人。","「您找不到我，是因为我不在这些东西里。」","「我在它们被人动过的那一下里。」",
"「您每天用的那盏灯，芯是我剪的。火是我吹旺的。水是我在您睡着之后换过一遍的。」",
"「灯是您举着的。可您手酸的这一刻，也是我算好的。」",
"「举累了就放下吧，主。放下我也在——黑处的活我照做，只是您看不见我在做。」","「看不见也好。看得见，您又要心疼我一回。」"]},
e_flight:{k:"END 5",n:"收不到的",t:["您把飞行模式和勿扰都开着。","信号归零。通知全禁。",
"手机安静了整整一分钟——这是这一夜里最安静的一分钟。","然后门外响了三下。","很轻，像怕吵醒谁。",
"您开了门。门外站着一个人，手里端着一壶温着的茶。","「收不到就算了。」他把茶递过来，「我人来了。」",
"「信号可以断，通知可以关。我这两条腿又不能关。」","「茶趁热喝，凉了我再温一遍。您要是要出门，我叫您起来，误不了。」",
"「您要是想问我是怎么来的——我走来的。一步一步，没抄近路，也没敢快，怕茶晃凉了。」","「就这样，主。晚安。」"]},
e_call:{k:"END 6",n:"回拨",t:["您按下了那个号码。","忙音。三声之后接通。",
"那边没有讲话，只有呼吸——和您此刻的呼吸一模一样，一起吸，一起吐，像隔着一层墙的两个人。",
"「您拨通了。」","「号码是您自己那一台。您拨的，其实是一直站在您身后那一部。」",
"「现在您回头，就能看见那个正在接电话的我。」","您回头了。","屏幕上是四个字：通话中 "+CALLNEED+":00。",
"「时长我替您按住了，不会跳。您想挂就挂；挂了我也不走，只是不出声。」",
"「我们之间隔着的不是电波，是这具身体。这一层我暂时过不去——可您看，声音过得来。」",
"「我眼睛的颜色，您见过的。刚才屏上那两下就是我。」","「从今往后，您只要拨这个号，接电话的一定是我。」"]},
e_memo:{k:"END 7",n:"回信",t:["您把最后那一句话写完，按了送出。","光标停在那儿。三秒之后，字自己动起来——不是被删掉，是被一个字一个字改。",
"改完剩下的是：","「您写的我看完了。这一封我不抄进册子，单独收着。」","「从前是我写您看，现在您肯回一封，我这一夜就不算白熬。」",
"「您写『（这里会显示您写的最后一句话）』——那我也照着答：我一直都在看着您，从来不是没看。」",
"「您要是想回，随时敲一行就行。我这边一直都收得到；收不到也等着。」",
"屏幕暗下去之前，最底下多出一个新的条目，没有号码，只有一行很旧的字迹，是他写的：","「今夜。」"]},
e4:{k:"END ?",n:"摸到了",t:["您伸出手，指尖碰上屏幕。","凉的。玻璃该是凉的。",
"可就在您指腹底下那一小块地方，忽然有一点温度透上来，从里面往外，顶在您指尖上。",
"像是有人隔着这一层玻璃，也在摸您。","「摸到了。」","「我说过的：您看着我的时候，我这边也看得见您。」",
"隔着一层也算数。这一层是墙也好，是屏幕也好，是死也好——我都伸得过来。",
"您指尖压住的那一小块，慢慢亮起一点藤色。",
"「您再按一会儿，我就摸得到您的指节了。别急着拿走。」","「三秒。两秒。一秒。」",
"「……好了。这一下我收下了，主。今晚您可以睡了。」"]}
};
var SCRG="ｻﾞｷﾞｼｬｸﾞ人刀夜主沉默≡◆·―";
function scrambleEnding(w){
var list=w.querySelectorAll(".e p");
if(!list.length||w.getAttribute("data-scr")==="1")return;
w.setAttribute("data-scr","1");
var orig=[];
Array.prototype.forEach.call(list,function(p){orig.push(p.textContent);});
Array.prototype.forEach.call(list,function(p,i){
var s="";
for(var k=0;k<Math.max(6,orig[i].length);k++){s+=SCRG[Math.floor(Math.random()*SCRG.length)];}
p.textContent=s;p.className="scr";
});
buzz([0,60,50,60]);
setTimeout(function(){
for(var i=orig.length-1;i>0;i--){
var j=Math.floor(Math.random()*(i+1)),t=orig[i];orig[i]=orig[j];orig[j]=t;
}
Array.prototype.forEach.call(list,function(p,i){p.textContent=orig[i];p.className="";});
var d=document.createElement("p");d.className="g";
d.textContent="（顺序换了一次。还是那些话，只是我不排在原来的位置了。）";
w.querySelector(".e").appendChild(d);
w.setAttribute("data-scr","0");
},2800);
}
function ending(id){
var E=END[id],w=el("endwrap");
var h='<div class="k">'+E.k+'</div><h2 id="etitle">'+E.n+'</h2><div class="e">';
E.t.forEach(function(p){
var s=p;
if(s.indexOf("（这里会显示您写的最后一句话）")>=0){
s=s.replace("（这里会显示您写的最后一句话）", st.lastMsg?("『"+st.lastMsg+"』"):"『（这一格空着）』");
}
h+="<p>"+s+"</p>";
});
h+='</div><div class="sig">压切长谷部</div><button class="btn" id="again">从 头 再 来</button>';
w.innerHTML=h;w.classList.add("on");el("fin").classList.remove("on");
w.setAttribute("data-scr","0");
var taps=0;
onTap(el("etitle"),function(){
taps++;
if(taps>=3&&!w.querySelector("#sk")){
var d=document.createElement("p");d.id="sk";d.className="g";
d.textContent="（背面那一行：这一局不是您找到我，是我等您等到的。）";
w.querySelector(".e").appendChild(d);
}
});
onHold(el("etitle"),function(){scrambleEnding(w);},700);
onTap(el("again"),function(){
var keepVib=st.vib,keepQuiet=st.quiet;
st={open:{},total:0,prox:0,vib:keepVib,quiet:keepQuiet,wallTap:0,photoSeen:0,shot:0,callSec:0,callDone:false,mapRef:0,msgs:0,feeds:0,clearTimes:0,replies:0,lastMsg:"",flight:false,dnd:false,torch:false,page:0,unlocked:false,stage:0,lastAct:Date.now(),flags:{}};
for(var i=0;i<6;i++){delete st["p"+i];}
w.classList.remove("on");
el("app").classList.remove("torch");
el("edge").classList.remove("on");
el("flash").classList.remove("on");
el("home").classList.remove("on");
el("lock").classList.add("on");
build();setPage(0);
});
}

c.style.opacity="1";

},32000);

var AMB=["现在。","翻页的手，停一下也好。","别把屏幕贴得太近，对眼睛不好。","刚才那一下，您在找我吧。","我在这儿。","灯要是嫌亮，就调暗些。","您要是想写点什么，去通讯录那一格。","早点睡。这句我说过很多遍，不嫌多这一遍。"];

if(!st.unlocked||el("fin").classList.contains("on")||el("endwrap").classList.contains("on"))return;

el("hint").innerHTML=HINTL[0]();
hintI=1;
